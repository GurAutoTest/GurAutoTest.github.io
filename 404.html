<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Codemarca</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.png">
  <script>
    (function () {
      var p = window.location.pathname;
      var segs = p.split("/").filter(Boolean);
      var last = segs[segs.length - 1] || "";
      // If it looks like a username path (e.g. /ghhghjjh, /username)
      if (last && !last.includes(".") && last !== "dashboard") {
        var cleanHandle = last.toLowerCase().replace(/[^a-z0-9._-]/g, "");
        if (cleanHandle) {
          window.location.replace("profile.html?handle=" + encodeURIComponent(cleanHandle) + window.location.search);
          return;
        }
      }
      window.location.replace("homepage.html");
    })();
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #F4F3F7; color: #101215; text-align: center; }
    .box { background: #fff; padding: 32px 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
    .box p { margin: 0; font-size: 1rem; color: #5B5D68; font-weight: 600; }
  </style>
</head>
<body>
  <div class="box">
    <p>Loading Codemarca page...</p>
  </div>
</body>
</html>
