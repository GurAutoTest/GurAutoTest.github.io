<!-- ==========================================================================
     CODEMARCA — MESSAGES (Phase-1, Garry 2026-10-13)
     Quick chat's inbox. Requests from people who scanned the sticker or
     opened the link; chats once a request is accepted; the Quick chat
     switch; today's 500 characters; who can see the follower counts.
     Everything is drawn by CM.mountMessages in ../../social.js from this
     folder's state.js — the markup below is the same in all four folders.
     A folder with no page (1-empty, 3-pack-coming) gets the "make your
     page first" card: nobody can scan to message, and real pages only.
     On a phone it opens from the chat icon beside the bell.
     ========================================================================== -->

<div class="app">
  <div class="app__main">
    <main class="view">
      <header class="head">
        <h1>Messages</h1>
        <p>From people who scanned your sticker or opened your link.</p>
      </header>

      <div class="stack" data-messages></div>
    </main>
  </div>
</div>

<script src="state.js"></script>
<script src="../../dashboard.js"></script>
<script src="../../social.js"></script>
<script>
  CM.mountMessages(CM.shell({ page: "messages", title: "Messages" }));
</script>
