<!-- ==========================================================================
     CODEMARCA — QUICK CHAT (Phase-1; redesigned as a chat app 2026-10-17)
     The file keeps its old name, messages.html, so every link still lands.
     Laptop: one card, chat list left, the open chat right. Phone: the list
     fills the tab, a chat slides in full screen over the bars.
     Scan (first circle in the list) opens the camera screen — find a
     Codemarca sticker or type codemarca.com/<name>, then Quick Chat.
     Everything is drawn by CM.mountMessages in ../../quick-chat.js from this
     folder's state.js — the markup below is the same in all four folders.
     A folder with no page (1-empty, 3-pack-coming) gets the "make your
     page first" screen: nobody can scan to message, and real pages only.
     On a phone it opens from the chat icon beside the bell.
     ========================================================================== -->

<div class="app">
  <div class="app__main">
    <main class="view view--chat">
      <div data-messages></div>
    </main>
  </div>
</div>

<script src="state.js"></script>
<script src="../../dashboard.js"></script>
<script src="../../photo-kit.js"></script>
<script src="../../quick-chat.js"></script>
<script>
  CM.mountMessages(CM.shell({ page: "messages", title: "Quick Chat" }));
</script>
