<title>Codemarca Signup</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">

<style>
/* ==========================================================================
   CODEMARCA — SIGNUP / LOGIN
   One screen, three flows, switched by <body data-flow>:
     build  — came from "Claim profile", handle carried into the headline
     order  — came from "Get your pack", handle asked at onboarding step 2
     login  — returning user

   Content budget, set against the Linktree reference in moodboard/linktree/:
   headline, one line under it, one button, one legal line, one link out.
   Nothing else earns a place on an auth screen. The right panel is image only.
   ========================================================================== */

/* ── 0. TOKENS ─────────────────────────────────────────────────────────── */
:root {
  /* Brand — locked 2026-09-01 */
  --brand-violet:#6E27E6; --brand-violet-lift:#A171F4; --brand-violet-press:#5A1DC4;
  --brand-violet-tint:#F1E9FE; --brand-violet-edge:#DCC9FB;

  /* Ink */
  --ink:#101215; --ink-mid:#5B5D68; --ink-soft:#8C8E9C; --ink-faint:#B6B8C4;
  --ink-invert:#FFFFFF;

  /* Ground */
  --ground:#FFFFFF; --ground-soft:#F4F3F7; --ground-sunk:#EDEBF2;

  /* Line */
  --line:rgba(16,18,21,.09); --line-strong:rgba(16,18,21,.16);

  /* State */
  --ok:#17914F; --bad:#C4342B;

  /* Type */
  --font-sans:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  --fs-lead:clamp(1.0625rem,1.5vw,1.3125rem);
  --fs-body:1.0625rem; --fs-sm:.9375rem; --fs-label:.75rem;

  --lh-body:1.62;
  --ls-display:-.042em; --ls-body:-.011em; --ls-label:.14em; --ls-soft:.14px;
  --fw-medium:500; --fw-semibold:600; --fw-bold:700; --fw-black:800;

  /* Space */
  --s-1:.25rem; --s-2:.5rem; --s-3:.75rem; --s-4:1rem; --s-5:1.25rem;
  --s-6:1.5rem; --s-8:2rem; --s-10:2.5rem; --s-12:3rem; --s-16:4rem;

  /* Layout */
  --gutter:clamp(1.25rem,4vw,2.5rem);
  --logo-h:22px;
  --auth-col:420px;          /* the form column — one thought wide, nothing more */

  /* Radius */
  --r-xs:6px; --r-sm:10px; --r-md:16px; --r-lg:24px; --r-pill:999px;

  /* Elevation */
  --shadow-md:0 6px 20px rgba(16,18,21,.07);
  --shadow-lg:0 20px 56px rgba(16,18,21,.11);

  /* Controls */
  --control-h:64px;
  --btn-h-lg:62px;
  --focus-ring:0 0 0 3px var(--ground-sunk),0 0 0 5px var(--ink);
  --focus-glow:0 0 0 4px rgba(16,18,21,.08);

  /* Motion */
  --dur-fast:140ms; --dur:260ms;
  --ease:cubic-bezier(.22,.61,.36,1);
}
@media (max-width:760px){ :root{ --control-h:58px; --btn-h-lg:56px; } }

/* ── 1. BASE ───────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--font-sans); font-size:var(--fs-body); font-weight:var(--fw-medium);
  line-height:var(--lh-body); letter-spacing:var(--ls-body);
  -webkit-font-smoothing:antialiased;
}
h1,p{margin:0}
a{color:inherit; text-decoration:none}
button,input{font:inherit; color:inherit}
img,svg{display:block; max-width:100%}
[hidden]{display:none !important}
:focus-visible{outline:none; box-shadow:var(--focus-ring); border-radius:var(--r-xs)}

/* ── 2. THE SPLIT ──────────────────────────────────────────────────────── */
.auth{display:grid; grid-template-columns:1fr 1fr; min-height:100svh}

.auth__panel{
  display:flex; flex-direction:column;
  padding:var(--s-8) var(--gutter) var(--s-10);
  background:var(--ground);
}
.auth__logo{align-self:flex-start; padding:var(--s-1)}
.auth__logo svg{height:var(--logo-h); width:auto}

.auth__body{flex:1; display:flex; align-items:center; justify-content:center; padding-block:var(--s-12)}
.auth__inner{
  width:100%; max-width:var(--auth-col);
  display:flex; flex-direction:column; align-items:center; text-align:center;
  gap:var(--s-6);
}

/* ── 3. HEADLINE — the handle lives here, not in a card of its own ─────── */
.h1{
  font-size:clamp(2.125rem,3.6vw,2.875rem); font-weight:var(--fw-black);
  line-height:1.04; letter-spacing:var(--ls-display); text-wrap:balance;
}
.h1 .handle{color:var(--brand-violet); overflow-wrap:anywhere}
.sub{font-size:var(--fs-lead); color:var(--ink-mid); line-height:1.45; margin-top:var(--s-3)}
.head{display:flex; flex-direction:column; align-items:center}

/* the low-key change link, as decided — one word, under the line */
.change{
  margin-top:var(--s-3); background:none; border:0; cursor:pointer; padding:var(--s-2) var(--s-3);
  font-size:var(--fs-sm); font-weight:var(--fw-bold); color:var(--ink-soft);
  text-decoration:underline; text-underline-offset:3px; border-radius:var(--r-sm);
}
.change:hover{color:var(--ink)}

/* ── 4. THE HANDLE FIELD — only on screen while they are changing it ───── */
.edit{width:100%; display:flex; flex-direction:column; gap:var(--s-3)}
.claim__field{
  display:flex; align-items:center; height:var(--control-h);
  background:var(--ground); border-radius:var(--r-pill);
  box-shadow:inset 0 0 0 1.5px var(--line-strong), var(--shadow-md);
  padding-inline:var(--s-5);
  transition:box-shadow var(--dur) var(--ease);
}
.claim__field:focus-within{box-shadow:inset 0 0 0 1.5px var(--ink), var(--focus-glow), var(--shadow-md)}
.claim__prefix{
  font-family:var(--font-mono); font-size:clamp(.8125rem,1.3vw,1rem);
  color:var(--ink-soft); white-space:nowrap; user-select:none; letter-spacing:-.02em;
}
.claim__input{
  flex:1; min-width:0; border:0; background:none; outline:none;
  font-family:var(--font-mono); font-size:clamp(.8125rem,1.3vw,1rem);
  font-weight:var(--fw-semibold); letter-spacing:-.02em; padding-inline:2px;
  color:var(--brand-violet); caret-color:var(--brand-violet);
}
.claim__input::placeholder{color:var(--ink-faint); font-weight:400}
.claim__input:focus-visible{box-shadow:none}
.claim__save{
  flex-shrink:0; background:none; border:0; cursor:pointer; padding:var(--s-2);
  font-size:var(--fs-sm); font-weight:var(--fw-bold); color:var(--ink-soft); border-radius:var(--r-sm);
}
.claim__save:hover{color:var(--ink)}
.note{
  min-height:20px; font-size:var(--fs-sm); font-weight:var(--fw-semibold);
  opacity:0; transition:opacity var(--dur) var(--ease);
}
.note[data-show="true"]{opacity:1}
.note[data-state="ok"]{color:var(--ok)}
.note[data-state="bad"]{color:var(--bad)}
.note[data-state="idle"]{color:var(--ink-soft)}
.note b{font-family:var(--font-mono); font-weight:var(--fw-semibold)}

/* ── 5. THE ONE ACTION ─────────────────────────────────────────────────── */
.gbtn{
  display:flex; align-items:center; justify-content:center; gap:var(--s-3);
  width:100%; height:var(--btn-h-lg); border:0; border-radius:var(--r-pill);
  background:var(--ink); color:var(--ink-invert); cursor:pointer;
  font-weight:var(--fw-bold); font-size:var(--fs-body); letter-spacing:-.01em;
  transition:transform var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.gbtn:hover{background:var(--ink-strong, #33353D)}
.gbtn:active{transform:scale(.985)}
.gbtn__g{display:grid; place-items:center; width:26px; height:26px; border-radius:50%; background:#fff; flex-shrink:0}
.gbtn__g svg{width:15px; height:15px}
.gbtn[data-busy="true"]{background:var(--ink-mid); pointer-events:none}

.legal{font-size:var(--fs-sm); color:var(--ink-soft); line-height:1.5}
.legal a{color:var(--ink-mid); font-weight:var(--fw-bold); text-decoration:underline; text-underline-offset:3px}
.legal a:hover{color:var(--ink)}
.alt{font-size:var(--fs-sm); color:var(--ink-mid); font-weight:var(--fw-semibold)}
.alt a{color:var(--brand-violet); font-weight:var(--fw-bold); text-decoration:underline; text-underline-offset:3px}
.alt a:hover{color:var(--ink)}

.status{
  width:100%; padding:var(--s-3) var(--s-5); border-radius:var(--r-md);
  background:var(--ground-soft); font-size:var(--fs-sm); font-weight:var(--fw-semibold);
  color:var(--ink-mid); text-align:left;
}
.status[data-state="bad"]{background:#FCEFEE; color:var(--bad)}

/* ── 6. THE IMAGE PANEL — no copy of any kind ──────────────────────────── */
.auth__aside{background:var(--brand-violet-tint); padding:var(--s-6); display:flex}
.ph{
  position:relative; flex:1; display:flex; flex-direction:column; justify-content:flex-end;
  gap:var(--s-2); padding:var(--s-6); background:rgba(255,255,255,.5);
  border:1.5px dashed var(--brand-violet-edge); border-radius:var(--r-lg); overflow:hidden;
}
.ph__tag{
  align-self:flex-start; font-family:var(--font-mono); font-size:.625rem;
  font-weight:var(--fw-semibold); letter-spacing:var(--ls-label); text-transform:uppercase;
  color:var(--brand-violet); background:var(--ground); padding:4px 9px; border-radius:var(--r-xs);
  box-shadow:inset 0 0 0 1px var(--brand-violet-edge);
}
.ph__desc{font-size:var(--fs-sm); font-weight:var(--fw-semibold); color:var(--ink-mid); line-height:1.35; max-width:42ch}
.ph::before{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.6;
  background-image:linear-gradient(var(--brand-violet-edge) 1px,transparent 1px),
                   linear-gradient(90deg,var(--brand-violet-edge) 1px,transparent 1px);
  background-size:32px 32px;
}

/* The photo fills the panel; tall shots, so only top and bottom crop. */
.aside__pic{position:relative; flex:1; margin:0; overflow:hidden; border-radius:var(--r-lg); background:var(--ground-soft)}
.aside__pic img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}

/* ── 7. FLOW SWITCHING ─────────────────────────────────────────────────── */
[data-only]{display:none}
body[data-flow="build"] [data-only~="build"],
body[data-flow="order"] [data-only~="order"],
body[data-flow="login"] [data-only~="login"]{display:revert}

/* ── 8. RESPONSIVE ─────────────────────────────────────────────────────────
   Under 900 the image panel goes away entirely rather than stacking — an auth
   screen on a phone is the form and nothing else. */
@media (max-width:900px){
  .auth{grid-template-columns:1fr}
  .auth__aside{display:none}
  .auth__panel{min-height:100svh}
}
@media (max-width:540px){
  .claim__field{padding-inline:var(--s-4)}
}

/* ── 9. PREVIEW SWITCHER — review tool, delete before launch ─────────────
   Log in is not one of the buttons: the link under the Google button already
   goes there, so a second way in would just be the same control twice. */
.preview{
  display:none !important;
  position:fixed; right:var(--s-5); bottom:var(--s-5); z-index:80;
  display:flex; align-items:center; gap:var(--s-1); padding:5px; border-radius:var(--r-pill);
  background:var(--ground); box-shadow:var(--shadow-lg), inset 0 0 0 1px var(--line);
}
.preview button{
  border:0; cursor:pointer; background:none; color:var(--ink-soft);
  font-size:.8125rem; font-weight:var(--fw-bold); padding:7px var(--s-4);
  border-radius:var(--r-pill); white-space:nowrap;
  transition:background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.preview button:hover{color:var(--ink)}
.preview button[aria-pressed="true"]{background:var(--brand-violet); color:#fff}
@media (max-width:900px){
  .preview{right:auto; left:50%; transform:translateX(-50%)}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important; transition-duration:.001ms !important}
}

/* ── SUPPORTING TEXT ───────────────────────────────────────────────────
   Headings and body copy run on negative tracking. The small grey lines
   under them — subtitles, help, notes, values — do not: at 13–14px the
   letters need the air back instead. Any new small line on this page
   belongs in this list. */
.legal,
.alt,
.ph__desc,
.note{ letter-spacing:var(--ls-soft) }

/* Chrome paints its own pale-blue block behind anything it autofills, which
   overrides the field's own ground. Parking the transition indefinitely keeps
   our background and ink; it is the one fix that does not need to know the
   field's colour. */
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus,
input:-webkit-autofill:active{
  -webkit-text-fill-color:var(--ink);
  caret-color:var(--ink);
  transition:background-color 600000s 0s, color 600000s 0s;
}
</style>

        <button class="gbtn" type="button" id="googleBtn">
          <span class="gbtn__g" aria-hidden="true">
            <svg viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.79 2.72v2.26h2.9c1.7-1.57 2.69-3.88 2.69-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.95-2.18l-2.9-2.26c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.96 10.71a5.41 5.41 0 0 1 0-3.42V4.96H.96a9 9 0 0 0 0 8.08l3-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z"/></svg>
          </span>
          Continue with Google
        </button>

        <div class="status" id="status" hidden></div>

        <p class="legal" data-only="build order">By continuing you agree to our <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy policy</a>.</p>

        <p class="alt" data-only="build order">Already have an account? <a href="signup.html?mode=login">Log in</a></p>
        <p class="alt" data-only="login">New here? <a href="signup.html?next=build">Claim your link</a></p>

      </div>
    </div>
  </section>

  <!-- ══ RIGHT — image only. No copy lives on this side. ═══════════════ -->
  <aside class="auth__aside">
    <figure class="aside__pic">
      <img data-only="build login" src="assets/photos/codemarca-qr-sticker-salon-mirror-scan-tall.jpg" alt="Customer scanning a Codemarca QR sticker on a salon mirror with a phone" width="1536" height="2752">
      <img data-only="order" src="assets/photos/codemarca-qr-sticker-peel-from-pack-tall.jpg" alt="Hand peeling a Codemarca QR sticker off the Codemarca pack" width="1536" height="2752">
    </figure>
  </aside>

</div>

<!-- Review tool hidden for clean production experience -->
<div class="preview" role="group" aria-label="Preview flow" hidden style="display:none !important">
  <button type="button" data-set="build" aria-pressed="true">Claim profile</button>
  <button type="button" data-set="order" aria-pressed="false">Get your pack</button>
</div>

<script>
(function () {
  "use strict";

  /* Front-end demo data. On the real site the check hits the handles endpoint
     and the reserved list lives server-side. */
  var RESERVED = ["admin", "codemarca", "hello", "support", "help", "api",
                  "about", "login", "signup", "app", "www", "shop", "blog"];
  var TAKEN = ["gurdeep", "garry", "nikk", "nancy", "amit", "gill"];

  var body      = document.body;
  var edit      = document.getElementById("edit");
  var input     = document.getElementById("handleInput");
  var out       = document.getElementById("handleOut");
  var note      = document.getElementById("note");
  var changeBtn = document.getElementById("changeBtn");
  var saveBtn   = document.getElementById("saveBtn");
  var googleBtn = document.getElementById("googleBtn");
  var status    = document.getElementById("status");

  var params = new URLSearchParams(location.search);
  var flow   = params.get("mode") === "login" ? "login"
             : params.get("next") === "order" ? "order" : "build";
  var handle = clean(params.get("handle") || "gurdeep");

  setFlow(flow);
  setHandle(handle);

  function clean(v) { return String(v).toLowerCase().replace(/[^a-z0-9._-]/g, "").slice(0, 24); }
  function getHandle() { return clean(out.textContent); }
  function setHandle(v) { out.textContent = "/" + v; input.value = v; }

  function setFlow(f) {
    body.dataset.flow = f;
    document.title = f === "login" ? "Codemarca — Log in" : "Codemarca — Sign up";
    Array.prototype.forEach.call(document.querySelectorAll(".preview button"), function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.set === f));
    });
  }

  function showNote(state, html) { note.dataset.state = state; note.dataset.show = "true"; note.innerHTML = html; }
  function hideNote() { note.dataset.show = "false"; }

  function check(v) {
    if (v.length < 3) return { ok: false, why: "Pick a link with at least 3 characters." };
    if (RESERVED.indexOf(v) > -1) return { ok: false, why: "<b>" + v + "</b> is reserved. Try another." };
    if (TAKEN.indexOf(v) > -1) return { ok: false, why: "<b>" + v + "</b> went to someone else. <b>" + v + "01</b> is free." };
    return { ok: true };
  }

  changeBtn.addEventListener("click", function () {
    edit.hidden = false;
    changeBtn.hidden = true;
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  });

  function closeEdit() {
    var v = clean(input.value);
    var r = check(v);
    if (!r.ok) { showNote("bad", r.why); input.focus(); return false; }
    setHandle(v);
    edit.hidden = true;
    changeBtn.hidden = false;
    hideNote();
    return true;
  }
  saveBtn.addEventListener("click", closeEdit);

  var debounce = null;
  input.addEventListener("input", function () {
    var v = clean(input.value);
    if (v !== input.value) input.value = v;
    clearTimeout(debounce);
    if (!v) { hideNote(); return; }
    if (v.length < 3) { showNote("idle", "3 characters or more."); return; }
    showNote("idle", "Checking…");
    debounce = setTimeout(function () {
      var r = check(v);
      if (r.ok) showNote("ok", "<b>codemarca.com/" + v + "</b> is free.");
      else showNote("bad", r.why);
    }, 420);
  });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); closeEdit(); }
    if (e.key === "Escape") { input.value = getHandle(); edit.hidden = true; changeBtn.hidden = false; hideNote(); }
  });

  function say(state, text) { status.hidden = false; status.dataset.state = state; status.textContent = text; }

  /* The handle is re-checked here, on submit, rather than held by a timed
     reservation — decided 2026-09-04. Whoever signs in first gets it. */
  /* what the real Google sign-in hands back; ?name= overrides it so the
     screen can be reviewed as somebody else */
  var GOOGLE_NAME = new URLSearchParams(location.search).get("name") || "Garry Singh";

  googleBtn.addEventListener("click", function () {
    if (body.dataset.flow === "build") {
      if (!edit.hidden && !closeEdit()) return;
      var r = check(getHandle());
      if (!r.ok) {
        say("bad", "That link is gone. Pick another one and try again.");
        edit.hidden = false; changeBtn.hidden = true;
        showNote("bad", r.why);
        input.focus();
        return;
      }
    }
    status.hidden = true;
    googleBtn.dataset.busy = "true";
    setTimeout(function () {
      googleBtn.dataset.busy = "false";
      /* Google itself is not wired yet; the hop it makes afterwards is.
         The claim route carries the handle AND the Google account's name
         into the builder (Garry, 2026-09-23) — sign-in is Google-only, so
         the name is already known and asking for it again is asking a
         question we have the answer to. GOOGLE_NAME stands in for what the
         real sign-in hands back. The pack route
         goes to select-pack.html, which is the first thing a buyer has to
         answer — an address form for a pack nobody has chosen yet is a form
         asking the second question first. No `built` flag on this route:
         somebody arriving from the website has no page yet. The free pack
         is always for themselves (2026-09-18) — gifts are ordered later,
         from the dashboard. */
      if (body.dataset.flow === "build") {
        location.href = "onboarding.html?handle=" + encodeURIComponent(getHandle()) +
          "&name=" + encodeURIComponent(GOOGLE_NAME);
        return;
      }
      if (body.dataset.flow === "order") {
        location.href = "select-pack.html";
        return;
      }
      /* LOGIN — added 2026-09-16 with the flow folders.
         In the real build this branches on what the account actually has,
         and the four folders under dashboard/ are the four answers:

           page + delivered pack   4-active
           page, no pack           2-page-live
           pack, no page           3-pack-coming
           nothing yet             1-empty

         1-empty is also the answer to the other gap Garry found: someone
         who signs up without picking a lane. That screen leads with "build
         my page" and keeps "see the pack" underneath, which is the fork
         the homepage never gave them.

         Here it goes to the finished account, because that is the one worth
         landing on when reviewing. */
      location.href = "dashboard/home.html";
    }, 700);
  });

  /* Preview switcher — review tool, delete before launch. */
  Array.prototype.forEach.call(document.querySelectorAll(".preview button"), function (b) {
    b.addEventListener("click", function () {
      setFlow(b.dataset.set);
      status.hidden = true;
      edit.hidden = true;
      changeBtn.hidden = false;
      hideNote();
    });
  });
})();
</script>
